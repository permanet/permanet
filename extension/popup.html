<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0a;
      color: #e5e5e5;
      padding: 20px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
      padding-bottom: 14px;
      border-bottom: 1px solid #262626;
    }

    .header .logo {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #f59e0b;
    }

    .url-display {
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 12px;
      color: #a3a3a3;
      word-break: break-all;
      margin-bottom: 16px;
      padding: 10px 12px;
      background: #141414;
      border: 1px solid #262626;
      border-radius: 6px;
      max-height: 60px;
      overflow: hidden;
    }

    .btn-archive {
      width: 100%;
      padding: 12px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: #f59e0b;
      color: #0a0a0a;
      transition: background 0.15s;
    }

    .btn-archive:hover { background: #d97706; }
    .btn-archive:disabled {
      background: #262626;
      color: #525252;
      cursor: not-allowed;
    }

    .hint {
      font-size: 11px;
      color: #525252;
      text-align: center;
      margin-top: 12px;
      line-height: 1.4;
    }

    /* Progress state */
    .progress-container {
      display: none;
      margin-bottom: 8px;
    }

    .progress-container.active { display: block; }

    .progress-step {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 0;
      font-size: 12px;
      color: #525252;
    }

    .progress-step.active { color: #f59e0b; }
    .progress-step.done { color: #34d399; }

    .progress-step .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #262626;
      flex-shrink: 0;
    }

    .progress-step.active .dot {
      background: #f59e0b;
      animation: pulse 1s ease-in-out infinite;
    }

    .progress-step.done .dot { background: #34d399; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* Success state */
    .success-container {
      display: none;
      text-align: center;
    }

    .success-container.active { display: block; }

    .success-icon {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .success-title {
      font-size: 14px;
      font-weight: 600;
      color: #34d399;
      margin-bottom: 4px;
    }

    .success-subtitle {
      font-size: 12px;
      color: #a3a3a3;
      margin-bottom: 16px;
    }

    .btn-view {
      display: inline-block;
      width: 100%;
      padding: 10px;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid #f59e0b;
      border-radius: 6px;
      background: transparent;
      color: #f59e0b;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
      transition: background 0.15s;
    }

    .btn-view:hover {
      background: rgba(245, 158, 11, 0.1);
    }

    /* Error state */
    .error-msg {
      display: none;
      font-size: 12px;
      color: #ef4444;
      margin-top: 12px;
      padding: 10px 12px;
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.2);
      border-radius: 6px;
    }

    .error-msg.active { display: block; }

    /* Source label */
    .source-label {
      display: inline-block;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.06em;
      color: #525252;
      background: #1a1a1a;
      border: 1px solid #262626;
      border-radius: 3px;
      padding: 2px 6px;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="icons/icon48.png" alt="" style="width: 22px; height: 22px;" />
    <span class="logo">PERMANET</span>
  </div>

  <!-- Initial state -->
  <div id="initial-state">
    <div class="source-label">BROWSER CAPTURE</div>
    <div class="url-display" id="current-url">Loading...</div>
    <button class="btn-archive" id="archive-btn">Archive This Page</button>
    <p class="hint">
      Captures exactly what you see — works on private accounts, paywalled sites, and authenticated pages.
    </p>
  </div>

  <!-- Progress state -->
  <div class="progress-container" id="progress-state">
    <div class="progress-step" id="step-capture">
      <span class="dot"></span> Capturing page...
    </div>
    <div class="progress-step" id="step-upload">
      <span class="dot"></span> Uploading to Permanet...
    </div>
    <div class="progress-step" id="step-hash">
      <span class="dot"></span> Hashing &amp; timestamping...
    </div>
    <div class="progress-step" id="step-done">
      <span class="dot"></span> Archiving complete
    </div>
  </div>

  <!-- Success state -->
  <div class="success-container" id="success-state">
    <div class="success-icon">✓</div>
    <div class="success-title">Archived successfully</div>
    <div class="success-subtitle" id="archive-title"></div>
    <a class="btn-view" id="view-link" href="#" target="_blank">View Archive →</a>
  </div>

  <!-- Error -->
  <div class="error-msg" id="error-msg"></div>

  <script src="popup.js"></script>
</body>
</html>
