version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: permanet
      POSTGRES_PASSWORD: permanet
      POSTGRES_DB: permanet
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U permanet"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://permanet:permanet@db:5432/permanet
      PINATA_JWT: ${PINATA_JWT}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
      NODE_ENV: production
      PORT: 3001
      FRONTEND_URL: http://localhost:3001
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - captures:/app/backend/captures

volumes:
  pgdata:
  captures:
